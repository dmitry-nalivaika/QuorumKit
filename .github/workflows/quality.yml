name: QuorumKit Library Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-check:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run quality gates
        run: bash src/scripts/quality-check.sh

  pipeline-validator:
    name: Pipeline Validator (FR-020)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install orchestrator deps
        run: npm ci
        working-directory: engine/orchestrator
      - name: Validate every pipeline file under src/pipelines/
        run: node engine/orchestrator/pipeline-validator-cli.js src/pipelines # apm-allow: M8 — engine Action not yet published (#47 step 9 — pending engine/ relocation + release workflow)

  verify-mirror:
    name: Verify Mirror (ADR-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install orchestrator deps (for js-yaml in verify-mirror.sh)
        run: npm ci
        working-directory: engine/orchestrator
      - name: Run verify-mirror.sh
        run: bash src/scripts/verify-mirror.sh

  orchestrator-tests:
    name: Orchestrator Tests (FR-023)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install orchestrator deps
        run: npm ci
        working-directory: engine/orchestrator
      - name: Install dashboard deps (ws required by server.js in tests)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: engine/dashboard
      - name: Run vitest suite
        run: npm test
        working-directory: engine/orchestrator

  regulation-lint:
    name: Regulation Lint (FR-014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install orchestrator deps
        run: npm ci
        working-directory: engine/orchestrator
      - name: Lint pipelines against regulation document
        run: node engine/orchestrator/regulation-lint.js # apm-allow: M8 — engine Action not yet published (#47 step 9 — pending engine/ relocation + release workflow)

  markdown-links:
    name: Markdown Link Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check markdown links
        run: |
          # Skip:
          #   • node_modules — third-party docs.
          #   • templates/seed/ and src/seed/ — consumer-repo seed files;
          #     relative links resolve against the *consumer's* root
          #     post-install, not against the SoT path. Validating them
          #     here yields false negatives.
          find . -name "*.md" \
            -not -path "*/node_modules/*" \
            -not -path "./templates/seed/*" \
            -not -path "./src/seed/*" \
            | xargs markdown-link-check --config .markdown-link-check.json
