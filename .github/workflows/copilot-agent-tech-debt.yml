name: Tech-Debt Agent (Copilot)

on:
  schedule:
    - cron: '0 8 1-7 * 1'
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332); must match an endpoint declared in src/runtimes.yml (SEC-HIGH-001)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Must equal the literal string AZURE_OPENAI_API_KEY to use that credential (bounded allowlist, SEC-CRIT-001); any other value falls back to GITHUB_TOKEN (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      focus:
        description: 'Analysis focus area'
        required: false
        type: choice
        options: [all, complexity, dead-code, dependencies, mutations]
        default: all
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  tech-debt:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'tech-debt-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Tech-Debt Agent via GitHub Models
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOCUS: ${{ github.event.inputs.focus || 'all' }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          RUNTIME_CREDENTIAL: ${{ github.event.inputs.runtime_credential_ref == 'AZURE_OPENAI_API_KEY' && secrets.AZURE_OPENAI_API_KEY || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const agentInstructions = readSafe('.github/agents/tech-debt-agent.md');
            const constitution      = readSafe('.specify/memory/constitution.md');

            const issueNumber   = context.payload.issue?.number;   // set when triggered via 'issues: labeled'
            const focusArea     = process.env.FOCUS;

            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub tech-debt analysis agent.';

            const userContent =
              `Trigger: ${context.eventName}.\n` +
              `Focus area: ${focusArea}.\n` +
              (issueNumber ? `Issue: #${issueNumber}\n` : '') +
              `Run a tech-debt health review for focus area "${focusArea}". ` +
              `Produce a structured report and list up to 5 items above threshold that should ` +
              `become GitHub Issues. Be specific about files/modules involved.`;

            // ADR-332: route to the maintainer's own Azure OpenAI / Azure AI
            // Foundry deployment when the Orchestrator's azure-openai runtime
            // adapter supplied these inputs; otherwise fall back to the
            // existing GitHub Models default (byte-for-byte unchanged).
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || '';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL || process.env.GITHUB_TOKEN;
            // SEC-CRIT-002 (Security Agent review, PR #334): restrict RUNTIME_ENDPOINT to
            // known Azure OpenAI / Azure AI Foundry hosts so it cannot be used as an SSRF
            // primitive if this workflow is ever dispatched directly (bypassing the Orchestrator).
            const allowedRuntimeEndpointHostSuffixes = ['.openai.azure.com', '.cognitiveservices.azure.com'];
            const isAllowedRuntimeEndpoint = raw => {
              try {
                const u = new URL(raw);
                return u.protocol === 'https:' && allowedRuntimeEndpointHostSuffixes.some(s => u.hostname.toLowerCase().endsWith(s));
              } catch { return false; }
            };
            if (runtimeEndpoint && !isAllowedRuntimeEndpoint(runtimeEndpoint)) {
              core.setFailed(`RUNTIME_ENDPOINT host is not on the allowlist (must be an https URL ending in ${allowedRuntimeEndpointHostSuffixes.join(' or ')}): ${runtimeEndpoint}`);
              return;
            }
            // SEC-HIGH-001 (Security re-review, PR #334): a host-suffix allowlist alone
            // doesn't bind the endpoint to the maintainer's own resource — anyone can
            // provision an Azure resource under the same public suffix. Reject any
            // endpoint that isn't one of the maintainer-reviewed entries committed to
            // src/runtimes.yml, so an attacker-provisioned resource is never reachable
            // even when RUNTIME_ENDPOINT is supplied directly via workflow_dispatch.
            const declaredRuntimeEndpoints = new Set(
              [...readSafe('src/runtimes.yml').matchAll(/^\s+endpoint:\s*(\S+)\s*$/gm)].map(m => m[1])
            );
            if (runtimeEndpoint && !declaredRuntimeEndpoints.has(runtimeEndpoint)) {
              core.setFailed(`RUNTIME_ENDPOINT is not declared in src/runtimes.yml: ${runtimeEndpoint}`);
              return;
            }
            const requestUrl = runtimeEndpoint
              ? `${runtimeEndpoint}/chat/completions${runtimeApiVersion ? `?api-version=${runtimeApiVersion}` : ''}`
              : 'https://models.inference.ai.azure.com/chat/completions';
            const authHeaders = runtimeEndpoint
              ? { 'api-key': runtimeCredential }
              : { 'Authorization': `Bearer ${runtimeCredential}` };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: runtimeModel,
                messages: [
                  { role: 'system', content: systemContent },
                  { role: 'user',   content: userContent },
                ],
                max_tokens: 2048,
              }),
            });

            if (!res.ok) {
              const txt = await res.text();
              core.setFailed(`Runtime API error ${res.status}: ${txt}`);
              return;
            }

            const data   = await res.json();
            const report = data.choices?.[0]?.message?.content?.trim()
              ?? '⚠️ Tech-debt agent produced no output.';

            const today = new Date().toISOString().slice(0,7); // YYYY-MM
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `🔧 Tech-Debt Report – ${today} (${focusArea})`,
              body:   report,
              labels: ['tech-debt', 'agent-report'],
            });
