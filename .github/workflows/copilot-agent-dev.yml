# apm-allow-divergence: This workflow and src/.github/workflows/copilot-agent-dev.yml
# are kept in sync. Both use the iterative dev-agent-runner.cjs loop (Copilot runtime).
# Do NOT replace either file with a one-shot inline script.
name: Developer Agent (Copilot)

on:
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Optional secret name holding the API key for runtime_endpoint (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      issue_number:
        description: 'Issue or PR number triggering this agent'
        required: true
      run_id:
        description: 'Orchestrator run ID (traceability)'
        required: false
        default: ''
      step:
        description: 'Orchestrator pipeline step name'
        required: false
        default: 'dev'
      iteration:
        description: 'Orchestrator iteration counter'
        required: false
        default: '1'

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install runner dependencies
        run: |
          if [ -f .github/scripts/package.json ]; then
            npm install --prefix .github/scripts
          fi

      - name: Run Developer Agent (iterative runner)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNTIME_KIND: copilot
          RUNTIME_NAME: copilot-default
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          RUNTIME_CREDENTIAL: ${{ (github.event.inputs.runtime_credential_ref && secrets[github.event.inputs.runtime_credential_ref]) || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          STEP: ${{ github.event.inputs.step }}
          ITERATION: ${{ github.event.inputs.iteration }}
        run: node .github/scripts/dev-agent-runner.cjs
