# apm-allow-divergence: This workflow uses the iterative dev-agent-runner.cjs loop
# (Copilot runtime). The distributed template in src/ intentionally retains the
# v1 inline script for downstream compatibility. These two files are allowed to
# differ — do NOT "sync" them to each other.
name: Developer Agent (Copilot)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number triggering this agent'
        required: true
      run_id:
        description: 'Orchestrator run ID (traceability)'
        required: false
        default: ''
      step:
        description: 'Orchestrator pipeline step name'
        required: false
        default: 'dev'
      iteration:
        description: 'Orchestrator iteration counter'
        required: false
        default: '1'

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install runner dependencies
        run: |
          if [ -f .github/scripts/package.json ]; then
            npm install --prefix .github/scripts
          fi

      - name: Run Developer Agent (iterative runner)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNTIME_KIND: copilot
          RUNTIME_NAME: copilot-default
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          STEP: ${{ github.event.inputs.step }}
          ITERATION: ${{ github.event.inputs.iteration }}
        run: node .github/scripts/dev-agent-runner.cjs
