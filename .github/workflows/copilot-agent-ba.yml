name: BA / Product Agent (Copilot)
# Issue number in the run title lets the Orchestrator map a finished run (workflow_run carries no inputs)
# back to its issue (#378). The engine parses the trailing `#<n>`.
run-name: "BA / Product Agent (Copilot) #${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}"

on:
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332); must match an endpoint declared in src/runtimes.yml (SEC-HIGH-001)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Must equal the literal string AZURE_OPENAI_API_KEY to use that credential (bounded allowlist, SEC-CRIT-001); any other value falls back to GITHUB_TOKEN (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      issue_number:
        description: 'Issue or PR number triggering this agent'
        required: true
      run_id:
        description: 'Orchestrator run ID (traceability; echoed in the result marker)'
        required: false
        default: ''
      step:
        description: 'Orchestrator pipeline step name'
        required: false
        default: 'ba'
      iteration:
        description: 'Orchestrator iteration counter'
        required: false
        default: '1'
      runtime_name:
        description: 'Named runtime entry from src/runtimes.yml that the Orchestrator resolved (reported back in the result marker)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  ba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run BA / Product Agent via GitHub Models
        id: agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          # Only set when a dispatch explicitly selects the Azure key. Otherwise leave empty so the script
          # resolves the credential from the runtime's credential_ref in src/runtimes.yml.
          RUNTIME_CREDENTIAL: ${{ github.event.inputs.runtime_credential_ref == 'AZURE_OPENAI_API_KEY' && secrets.AZURE_OPENAI_API_KEY || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const report = require('./.github/scripts/agent-report.cjs')
              .forGithubScript({ agent: 'ba', github, context, core });

            const agentInstructions = report.stripFootprintInstructions(readSafe('.github/agents/ba-product-agent.md'));
            const constitution      = readSafe('.specify/memory/constitution.md');

            const issueNumber = Number('${{ github.event.inputs.issue_number }}');
            await report.start({ issueNumber });

            let issueTitle = '';
            let issueBody  = '';
            let issueLabels = [];
            try {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
              });
              issueTitle = issue.data.title ?? '';
              issueBody  = issue.data.body  ?? '';
              issueLabels = issue.data.labels ?? [];
            } catch (e) {
              core.warning(`Could not fetch issue #${issueNumber}: ${e.message}`);
            }

            // #377: a `type:bug` issue with no spec gets a short bug-fix spec (Template C) written to
            // specs/NNN-slug/spec.md by this step; the publish step below then pushes it and opens the PR.
            // Every other issue keeps the requirements-summary prompt.
            const specAuthor = require('./.github/scripts/ba-spec-author.cjs');
            const existingSpec = specAuthor.findExistingSpec(process.cwd(), issueNumber);
            const mustAuthorSpec = specAuthor.isBugIssue(issueLabels) && !(existingSpec && existingSpec.hasSpec);

            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub BA/product agent.';

            const userContent = report.withOutcome(
              `You are acting as the BA / Product Agent for issue #${issueNumber}.\n` +
              `Title: ${issueTitle}\n\nBody:\n${issueBody}\n\n` +
              (mustAuthorSpec
                ? `Analyse the report and write the bug-fix spec for this issue.\n` +
                  specAuthor.buildSpecRequest({ issueNumber, title: issueTitle })
                : `Analyse requirements, identify acceptance criteria, flag any ambiguities, ` +
                  `and post a structured requirements summary as a comment.`));

            // ADR-332: resolve the runtime from src/runtimes.yml (default_runtime) unless a
            // dispatch supplied explicit inputs. GitHub Models (models.inference.ai.azure.com)
            // was retired on 2026-07-30 and no longer resolves, so there is NO hardcoded
            // fallback host: a missing or unreachable runtime fails loudly (ADR-332 section 5).
            const runtimesYaml = readSafe('src/runtimes.yml');
            const defaultRuntimeName = runtimesYaml.match(/^default_runtime:\s*(\S+)/m)?.[1] || '';
            const parseRuntime = (yaml, name) => {
              if (!name) return null;
              const head = new RegExp(`^\\s*${name}:\\s*$`, 'm').exec(yaml);
              if (!head) return null;
              const rest = yaml.slice(head.index + head[0].length);
              const end = rest.match(/^\s*\w[\w-]*:\s*$/m);
              const block = end ? rest.slice(0, end.index) : rest;
              return {
                endpoint: block.match(/^\s+endpoint:\s*(\S+)/m)?.[1] || '',
                model: block.match(/^\s+model:\s*(\S+)/m)?.[1] || 'gpt-4o',
                credentialRef: block.match(/^\s+credential_ref:\s*(\S+)/m)?.[1] || 'GITHUB_TOKEN',
                apiVersion: block.match(/api_version:\s*["']([^"']+)["']/)?.[1] || '',
              };
            };
            const defaultRuntime = parseRuntime(runtimesYaml, defaultRuntimeName);
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || defaultRuntime?.endpoint || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || defaultRuntime?.model || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || defaultRuntime?.apiVersion || '';
            const runtimeCredentialRef = defaultRuntime?.credentialRef || 'GITHUB_TOKEN';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL ||
              (runtimeCredentialRef === 'AZURE_OPENAI_API_KEY' ? process.env.AZURE_OPENAI_API_KEY : process.env.GITHUB_TOKEN);
            console.log(`Using runtime: ${defaultRuntimeName || '(none)'}; endpoint: ${runtimeEndpoint || '(none)'}; model: ${runtimeModel}; credential: ${runtimeCredentialRef}`);
            if (!runtimeEndpoint) {
              report.abort('No runtime endpoint: set default_runtime in src/runtimes.yml or dispatch with runtime_endpoint.');
              return;
            }
            if (!runtimeCredential) {
              report.abort(`Runtime credential ${runtimeCredentialRef} is not available to this workflow.`);
              return;
            }
            // SEC-CRIT-002 (Security Agent review, PR #334): restrict RUNTIME_ENDPOINT to
            // known Azure OpenAI / Azure AI Foundry hosts so it cannot be used as an SSRF
            // primitive if this workflow is ever dispatched directly (bypassing the Orchestrator).
            const allowedRuntimeEndpointHostSuffixes = ['.openai.azure.com', '.cognitiveservices.azure.com', '.services.ai.azure.com'];
            const isAllowedRuntimeEndpoint = raw => {
              try {
                const u = new URL(raw);
                return u.protocol === 'https:' && allowedRuntimeEndpointHostSuffixes.some(s => u.hostname.toLowerCase().endsWith(s));
              } catch { return false; }
            };
            if (runtimeEndpoint && !isAllowedRuntimeEndpoint(runtimeEndpoint)) {
              report.abort(`RUNTIME_ENDPOINT host is not on the allowlist (must be an https URL ending in ${allowedRuntimeEndpointHostSuffixes.join(' or ')}): ${runtimeEndpoint}`);
              return;
            }
            // SEC-HIGH-001 (Security re-review, PR #334): a host-suffix allowlist alone
            // doesn't bind the endpoint to the maintainer's own resource — anyone can
            // provision an Azure resource under the same public suffix. Reject any
            // endpoint that isn't one of the maintainer-reviewed entries committed to
            // src/runtimes.yml, so an attacker-provisioned resource is never reachable
            // even when RUNTIME_ENDPOINT is supplied directly via workflow_dispatch.
            const declaredRuntimeEndpoints = new Set(
              [...readSafe('src/runtimes.yml').matchAll(/^\s+endpoint:\s*(\S+)\s*$/gm)].map(m => m[1])
            );
            if (runtimeEndpoint && !declaredRuntimeEndpoints.has(runtimeEndpoint)) {
              report.abort(`RUNTIME_ENDPOINT is not declared in src/runtimes.yml: ${runtimeEndpoint}`);
              return;
            }
            // Foundry v1 "Responses" endpoints (…/openai/v1/responses) use a different
            // request/response shape than chat/completions; the legacy deployment-style
            // endpoints and the GitHub Models default keep using chat/completions.
            const useResponsesApi = !!runtimeEndpoint && /\/responses\/?$/.test(new URL(runtimeEndpoint).pathname);
            // The /openai/v1/ surface is versionless; do not send a dated api-version there.
            const sendApiVersion = runtimeApiVersion && !/\/openai\/v1\//.test(runtimeEndpoint);
            const apiVersionQuery = sendApiVersion ? `?api-version=${runtimeApiVersion}` : '';
            const requestUrl = useResponsesApi
              ? `${runtimeEndpoint}${apiVersionQuery}`
              : `${runtimeEndpoint}/chat/completions${apiVersionQuery}`;
            const authHeaders = { 'api-key': runtimeCredential };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(useResponsesApi
                ? {
                    model: runtimeModel,
                    instructions: systemContent,
                    input: userContent,
                    // Reasoning models spend output budget on reasoning tokens, so leave headroom.
                    max_output_tokens: 8192,
                  }
                : {
                    model: runtimeModel,
                    messages: [
                      { role: 'system', content: systemContent },
                      { role: 'user',   content: userContent },
                    ],
                    // 4096: a bug-fix spec is about a page, which the old 2048 summary budget could truncate.
                    max_tokens: 4096,
                  }),
            });

            if (!res.ok) {
              const txt = await res.text();
              report.abort(`Runtime API error ${res.status}: ${txt}`);
              return;
            }

            const extractText = d => (useResponsesApi
              ? (d.output_text ?? (d.output ?? [])
                  .filter(item => item.type === 'message')
                  .flatMap(item => item.content ?? [])
                  .filter(c => c.type === 'output_text')
                  .map(c => c.text)
                  .join(''))
              : d.choices?.[0]?.message?.content
            )?.trim() || undefined;

            const data  = await res.json();
            // Token usage + estimated cost for the audit trail (#335); never fails the run.
            report.recordUsage({ response: data, model: runtimeModel, runtime: defaultRuntimeName || 'azure-openai' });
            const reply = extractText(data);
            if (!reply) {
              report.abort('BA agent produced no output.');
              return;
            }

            // FR-024..FR-028: turn the reply into the spec file (or decide spec_gap / needs-human).
            // The module returns outcome=null for issues it does not handle (not a bug, or a spec
            // already exists) and the existing publish logic applies unchanged.
            const modelOutcome = require('./.github/scripts/agent-report.cjs').parseReply(reply).outcome;
            const authored = specAuthor.authorSpec({
              root: process.cwd(), issueNumber, title: issueTitle, labels: issueLabels, reply, modelOutcome,
            });
            // The comment carries the reply without the spec block (the spec lives in the file/PR).
            await report.reply({ issueNumber, reply: authored.action === 'authored' ? authored.rest : reply });
            if (authored.outcome) {
              // The module's verdict wins over the model's own OUTCOME line: success only with a spec on disk.
              report.verdict({ outcome: authored.outcome, summary: authored.summary });
              core.setOutput('authored_outcome', authored.outcome);
              core.info(`Spec authoring: ${authored.outcome}${authored.written ? ` (${authored.specPath})` : ''}`);
            }

      - name: Push spec branch and open PR
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORED_OUTCOME: ${{ steps.agent.outputs.authored_outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync, spawnSync } = require('child_process');
            const fs = require('fs');

            const report = require('./.github/scripts/agent-report.cjs')
              .forGithubScript({ agent: 'ba', github, context, core });

            const issueNumber = Number('${{ github.event.inputs.issue_number }}');
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // #377: the authoring step already settled spec_gap / needs-human (no spec was written).
            // Keep that verdict: nothing to publish, and the report step reads the agent step's outcome.
            if (process.env.AUTHORED_OUTCOME === 'spec_gap' || process.env.AUTHORED_OUTCOME === 'needs-human') {
              core.info(`Spec authoring reported ${process.env.AUTHORED_OUTCOME}; nothing to publish.`);
              return;
            }
            // ── 1. Determine spec path and branch name ───────────────────────
            // Derive branch from the spec directory whose name starts with NNN-
            const nnn = String(issueNumber).padStart(3, '0');
            const specsDir = 'specs';
            let specDir = null;
            if (fs.existsSync(specsDir)) {
              const entries = fs.readdirSync(specsDir);
              specDir = entries.find(e => e.startsWith(`${nnn}-`)) ?? null;
            }
            if (!specDir) {
              core.warning(`No specs/${nnn}-* directory found; skipping branch/PR step.`);
              report.verdict({ outcome: 'spec_gap', summary: `No specs/${nnn}-* directory exists, so no spec was published for #${issueNumber}.` });
              return;
            }
            const branchName = specDir;
            const specPath   = `${specsDir}/${specDir}/spec.md`;

            if (!fs.existsSync(specPath)) {
              core.warning(`${specPath} not found; skipping branch/PR step.`);
              report.verdict({ outcome: 'spec_gap', summary: `${specPath} was not found, so no spec was published for #${issueNumber}.` });
              return;
            }

            // ── 2. Dirty-tree guard ───────────────────────────────────────────
            // --untracked-files=all lists the files inside a new spec directory (a bare `??` entry for the
            // directory would not equal specPath and would trip the guard on a freshly written spec).
            const dirty = execSync('git status --porcelain --untracked-files=all', { encoding: 'utf8' })
              .split('\n')
              .map(l => l.trim())
              .filter(l => l.length > 0)
              .filter(l => {
                const file = l.replace(/^[A-Z?!]{1,2}\s+/, '');
                return file !== specPath && file !== '.specify/feature.json';
              });
            if (dirty.length > 0) {
              const fileList = dirty.map(l => `- \`${l}\``).join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `**BA Agent — Publish Error**\n\nAborting: the working tree has uncommitted changes to files outside the expected spec paths:\n\n${fileList}\n\nPlease resolve these before re-running the BA agent.`,
              });
              report.abort('Dirty working tree — aborting spec publish.');
              return;
            }

            // ── 3. Configure git identity ─────────────────────────────────────
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git config user.name "github-actions[bot]"');

            // ── 4. Create or check out branch ─────────────────────────────────
            {
              const verifyResult = spawnSync('git', ['rev-parse', '--verify', branchName], { encoding: 'utf8', stdio: 'pipe' });
              if (verifyResult.status === 0) {
                // Branch already exists — check it out without resetting (FR-003)
                const coResult = spawnSync('git', ['checkout', branchName], { encoding: 'utf8' });
                if (coResult.status !== 0) {
                  report.abort(`Failed to checkout branch ${branchName}: ${coResult.stderr}`);
                  return;
                }
              } else {
                // Branch is new — create from HEAD
                const coResult = spawnSync('git', ['checkout', '-b', branchName], { encoding: 'utf8' });
                if (coResult.status !== 0) {
                  report.abort(`Failed to create branch ${branchName}: ${coResult.stderr}`);
                  return;
                }
              }
            }

            // ── 5. Stage spec files ───────────────────────────────────────────
            spawnSync('git', ['add', specPath], { encoding: 'utf8' });
            if (fs.existsSync('.specify/feature.json')) {
              execSync('git add .specify/feature.json');
            }

            // ── 6. Extract feature title from spec heading ────────────────────
            const specContent = fs.readFileSync(specPath, 'utf8');
            const titleMatch  = specContent.match(/^# Spec:\s*(.+?)\s*(?:—|-).*Issue #\d+/m);
            const featureTitle = titleMatch ? titleMatch[1].trim() : `Issue #${issueNumber}`;

            // ── 7. Commit ─────────────────────────────────────────────────────
            // Determine new vs. update using the PR list (more reliable than git log exit code)
            const existingPrs = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branchName}`, state: 'open',
            });
            const isUpdate = existingPrs.data.length > 0;

            const commitMsg = isUpdate
              ? `docs(spec): refine spec for #${issueNumber} — ${featureTitle}`
              : `docs(spec): add spec for #${issueNumber} — ${featureTitle}`;

            {
              // Use spawnSync so commitMsg is never interpreted by the shell (OWASP A03)
              const commitResult = spawnSync('git', ['commit', '-m', commitMsg], { encoding: 'utf8' });
              if (commitResult.status !== 0) {
                // Nothing to commit (spec unchanged) — continue to PR upsert.
                core.info('Nothing to commit; proceeding to PR upsert.');
              }
            }

            // ── 8. Push ───────────────────────────────────────────────────────
            {
              const pushArgs = ['push', ...(isUpdate ? ['--force-with-lease'] : []), 'origin', branchName];
              const pushResult = spawnSync('git', pushArgs, { encoding: 'utf8' });
              if (pushResult.status !== 0) {
                const pushStderr = pushResult.stderr ?? '';
                if (pushStderr.includes('403')) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber,
                    body: `**BA Agent — Permission Error**\n\nFailed to push branch \`${branchName}\`. The \`GITHUB_TOKEN\` is missing the \`contents: write\` scope. Please grant this permission in the workflow file and re-run.`,
                  });
                  report.abort('Missing contents: write permission.');
                  return;
                }
                report.abort(`git push failed: ${pushStderr}`);
                return;
              }
            }

            // ── 9. ADR-trigger heuristic ──────────────────────────────────────
            const adrKeywords = ['new external', 'new storage', 'new protocol', 'new service', 'ADR'];
            const needsAdr = adrKeywords.some(kw => specContent.toLowerCase().includes(kw.toLowerCase()));
            const nextAgentLabel = needsAdr ? 'agent:architect' : 'agent:dev';

            // ── 10. PR title and body ─────────────────────────────────────────
            const prTitle = `docs(spec): #${issueNumber} — ${featureTitle}`;
            const prBody  = [
              `Refs #${issueNumber}`,
              '',
              `**Spec:** \`${specPath}\``,
              '',
              `## BA Handoff Summary`,
              '',
              `- User stories: ${(specContent.match(/^### US-/gm) ?? []).length}`,
              `- Functional requirements: ${(specContent.match(/^- \*\*FR-/gm) ?? []).length}`,
              `- Open questions resolved: ${specContent.includes('## Open Questions') && !specContent.match(/^\d+\./m) ? 'Yes (no unresolved items detected)' : 'See spec for details'}`,
              '',
              `**Originating issue:** https://github.com/${owner}/${repo}/issues/${issueNumber}`,
            ].join('\n');

            // ── 11. Create or update PR ───────────────────────────────────────
            let prUrl;
            try {
              if (existingPrs.data.length > 0) {
                const existingPr = existingPrs.data[0];
                await github.rest.pulls.update({
                  owner, repo, pull_number: existingPr.number, body: prBody,
                });
                prUrl = existingPr.html_url;
              } else {
                const defaultBranch = (await github.rest.repos.get({ owner, repo })).data.default_branch;
                const newPr = await github.rest.pulls.create({
                  owner, repo, head: branchName, base: defaultBranch,
                  title: prTitle, body: prBody,
                });
                prUrl = newPr.data.html_url;
                // Apply labels
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: newPr.data.number,
                  labels: ['type:spec', nextAgentLabel],
                });
              }
            } catch (e) {
              if (e.status === 403) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `**BA Agent — Permission Error**\n\nFailed to create/update PR for branch \`${branchName}\`. The \`GITHUB_TOKEN\` is missing the \`pull-requests: write\` scope. Please grant this permission in the workflow file and re-run.`,
                });
                report.abort('Missing pull-requests: write permission.');
                return;
              }
              throw e;
            }

            // ── 12. Post PR URL on the originating issue; the footprint (with the real apm-msg) follows ──
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                `**BA Agent — Spec Published**`,
                '',
                `Spec for issue #${issueNumber} has been committed to branch \`${branchName}\` and a PR is ready for review.`,
                '',
                `**PR:** ${prUrl}`,
              ].join('\n'),
            });

            report.verdict({
              outcome: 'success',
              summary: `Spec published for #${issueNumber}. PR: ${prUrl}`,
              pr: (prUrl.match(/\/pull\/(\d+)/) ?? [])[1] ?? '',
              branch: branchName,
              payload: { specPath, branch: branchName, prUrl },
            });

      - name: Report result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.publish.outputs.outcome || steps.agent.outputs.outcome }}
          SUMMARY: ${{ steps.publish.outputs.summary || steps.agent.outputs.summary }}
          ERROR: ${{ steps.publish.outputs.error || steps.agent.outputs.error }}
          PR_NUMBER: ${{ steps.publish.outputs.pr || steps.agent.outputs.pr }}
          BRANCH: ${{ steps.publish.outputs.branch || steps.agent.outputs.branch }}
          PAYLOAD: ${{ steps.publish.outputs.payload || steps.agent.outputs.payload }}
          USAGE: ${{ steps.agent.outputs.usage }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = require('./.github/scripts/agent-report.cjs')
              .forGithubScript({ agent: 'ba', github, context, core });
            await report.conclude({ env: process.env });
