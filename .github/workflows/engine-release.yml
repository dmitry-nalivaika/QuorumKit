# =============================================================================
# Engine Release — both distribution channels (T-12, FR-010, SC-009, SEC-HIGH-001)
#
# Trigger: push of a signed v* tag (e.g. v3.0.0).
# Channels released atomically from the same engine/ source:
#   1. GitHub Action ref — the tag itself (consumers use `uses: dmitry-nalivaika/quorumkit/engine@v3.0.0`).
#   2. npm package — published with --provenance via OIDC trusted publishing.
#
# Hardening:
#   • Tag MUST be signed and verified before publish (`git verify-tag`).
#   • permissions: contents:write (release notes) + id-token:write (OIDC) only.
#   • Environment `release` is required; protection rule mandates a maintainer
#     reviewer (configured in repo Settings → Environments → release).
#   • No NPM_TOKEN is read. Trusted publishing is enabled at npm registry side
#     (npmjs.com → package settings → trusted publisher → this workflow).
#   • SLSA build provenance is attached automatically by `npm publish --provenance`.
#
# Disaster-recovery fallback: see engine/RELEASING.md (T-23).
# =============================================================================
name: engine-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: verify tag, build, and publish to npm
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/quorumkit-engine
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC token for npm trusted publishing
    steps:
      - name: Checkout (full history for tag verification)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Import maintainer GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.MAINTAINER_GPG_PUBLIC_KEY }}
        run: echo "$GPG_PUBLIC_KEY" | gpg --import

      - name: Verify the pushed tag is signed
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying signature on $TAG"
          # `git verify-tag` exits non-zero if the tag is unsigned or the
          # signing key is not in the local keyring imported above.
          git verify-tag "$TAG"

      - name: Setup Node 20 with npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # token: '' would suppress github.token injection but setup-node
          # v4+ still writes the .npmrc placeholder. We obtain the OIDC token
          # explicitly below and pass it as NODE_AUTH_TOKEN instead.

      - name: Install engine devDeps + orchestrator runtime deps
        run: |
          cd engine && npm ci --ignore-scripts --no-audit --no-fund
          cd orchestrator && npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild dist/ bundle and verify it matches the tagged commit
        run: |
          cd engine
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::Tagged commit's engine/dist/ does not match a clean rebuild."
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Obtain npm OIDC token (Trusted Publisher)
        # SEC-HIGH-001: explicitly request a JWT with the npm audience from
        # GitHub's OIDC endpoint. The npm registry validates this JWT against
        # the Trusted Publisher config — no static NPM_TOKEN secret needed.
        id: npm-oidc
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" \
            | jq -r '.value')
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "::error::Failed to obtain OIDC token — check id-token:write permission"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with OIDC provenance
        # Uses the OIDC JWT (not a static NPM_TOKEN) as NODE_AUTH_TOKEN.
        # npm sends it as Authorization: Bearer <jwt>; the npm registry
        # validates it against the Trusted Publisher policy.
        working-directory: engine
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-oidc.outputs.token }}
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('-'),
            });
