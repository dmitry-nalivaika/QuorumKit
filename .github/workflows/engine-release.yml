# =============================================================================
# Engine Release — both distribution channels (T-12, FR-010, SC-009, SEC-HIGH-001)
#
# Trigger: push of a signed v* tag (e.g. v3.0.0).
# Channels released atomically from the same engine/ source:
#   1. GitHub Action ref — the tag itself (consumers use `uses: dmitry-nalivaika/quorumkit/engine@v3.0.0`).
#   2. npm package — published with --provenance via OIDC trusted publishing.
#
# Hardening:
#   • Tag MUST be signed and verified before publish (`git verify-tag`).
#   • permissions: contents:write (release notes) + id-token:write (OIDC) only.
#   • Environment `release` is required; protection rule mandates a maintainer
#     reviewer (configured in repo Settings → Environments → release).
#   • No NPM_TOKEN is read. Trusted publishing is enabled at npm registry side
#     (npmjs.com → package settings → trusted publisher → this workflow).
#   • SLSA build provenance is attached automatically by `npm publish --provenance`.
#
# Disaster-recovery fallback: see engine/RELEASING.md (T-23).
# =============================================================================
name: engine-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: verify tag, build, and publish to npm
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/quorumkit-engine
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC token for npm trusted publishing
    steps:
      - name: Checkout (full history for tag verification)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Import maintainer GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.MAINTAINER_GPG_PUBLIC_KEY }}
        run: echo "$GPG_PUBLIC_KEY" | gpg --import

      - name: Verify the pushed tag is signed
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying signature on $TAG"
          # `git verify-tag` exits non-zero if the tag is unsigned or the
          # signing key is not in the local keyring imported above.
          git verify-tag "$TAG"

      - name: Setup Node 22 with npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # npm Trusted Publishing requires npm CLI ≥ 11.5.1 (Node ≥ 22.14.0).
          # setup-node writes .npmrc with _authToken=${NODE_AUTH_TOKEN}; when
          # NODE_AUTH_TOKEN is unset, npm CLI automatically uses OIDC exchange.

      - name: Install engine devDeps + orchestrator runtime deps
        run: |
          cd engine && npm ci --ignore-scripts --no-audit --no-fund
          cd orchestrator && npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild dist/ bundle and verify it matches the tagged commit
        run: |
          cd engine
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::Tagged commit's engine/dist/ does not match a clean rebuild."
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Pre-publish diagnostics
        run: |
          echo "node=$(node --version) npm=$(npm --version)"
          echo "--- .npmrc ---"
          cat ~/.npmrc 2>/dev/null || echo "(no ~/.npmrc)"
          cat .npmrc 2>/dev/null || echo "(no ./.npmrc)"
          echo "--- OIDC env ---"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]] && echo YES || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]] && echo YES || echo NO)"
          echo "NODE_AUTH_TOKEN set: $([[ -n "$NODE_AUTH_TOKEN" ]] && echo YES || echo NO)"

      - name: Publish to npm with OIDC provenance
        # SEC-HIGH-001: no NODE_AUTH_TOKEN — npm CLI 11+ (bundled with Node 22+)
        # automatically performs the OIDC Trusted Publisher flow:
        #   1. npm fetches a JWT (audience=npm) from GitHub's OIDC endpoint
        #   2. npm exchanges it at the npm registry for a scoped publish token
        #   3. npm uses that token for the PUT publish request
        # Provenance is generated automatically when publishing via Trusted
        # Publisher; the --provenance flag is kept for explicitness.
        working-directory: engine
        run: npm publish --provenance --access public --loglevel verbose

      - name: Create the GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('-'),
            });
