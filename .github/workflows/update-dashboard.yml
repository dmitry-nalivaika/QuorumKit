name: Update Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - 'quorumkit.yml'
      - 'engine/dashboard/generate-dashboard.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Generate dashboard
        run: node engine/dashboard/generate-dashboard.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet engine/dashboard/index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated dashboard
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "docs-agent[bot]"
          git config user.email "docs-agent@users.noreply.github.com"
          git add engine/dashboard/index.html
          git commit -m "chore(dashboard): auto-sync agent data from .github/agents [skip ci]"
          git push

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "✅ Dashboard is already up to date."
