name: BA Issue Enrichment Agent (Copilot)
# Issue number in the run title lets the Orchestrator map a finished run (workflow_run carries no inputs)
# back to its issue (#378). The engine parses the trailing `#<n>`.
run-name: "BA Issue Enrichment Agent (Copilot) #${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}"
# Triggered automatically by the Orchestrator (ba-enrichment-pipeline, FR-001)
# when the Triage Agent applies the `triaged` label to an issue that already
# carries `agent:ba`.
#
# This workflow operates in ISSUE-REFINEMENT MODE only:
#   - Reads the sparse issue body and the triage comment.
#   - Uses GitHub Models to infer the four missing structured sections.
#   - Updates the issue body in-place (gh issue edit) when all four sections
#     can be confidently inferred.
#   - Removes `status:needs-info` and adds `status:confirmed` on success.
#   - Retains `status:needs-info` and posts clarification questions on failure.
#   - Posts a human-readable comment after every attempt.
#
# CONSTRAINTS (FR-010):
#   - Does NOT create any git branch, spec file, plan file, task file, or code.
#   - Only modifies the body and labels of the specific issue being processed.

on:
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332); must match an endpoint declared in src/runtimes.yml (SEC-HIGH-001)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Must equal the literal string AZURE_OPENAI_API_KEY to use that credential (bounded allowlist, SEC-CRIT-001); any other value falls back to GITHUB_TOKEN (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      issue_number:
        description: 'Issue number to enrich (passed by the Orchestrator)'
        required: true
      run_id:
        description: 'Orchestrator run ID (traceability; echoed in the result marker)'
        required: false
        default: ''
      step:
        description: 'Orchestrator pipeline step name'
        required: false
        default: 'ba-enrich'
      iteration:
        description: 'Orchestrator iteration counter'
        required: false
        default: '1'
      runtime_name:
        description: 'Named runtime entry from src/runtimes.yml that the Orchestrator resolved (reported back in the result marker)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  models: read

jobs:
  ba-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enrich Issue Body via GitHub Models
        id: agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          # Only set when a dispatch explicitly selects the Azure key. Otherwise leave empty so the script
          # resolves the credential from the runtime's credential_ref in src/runtimes.yml (falling back to
          # GITHUB_TOKEN). A non-empty GITHUB_TOKEN here would always win and break issues-event runs.
          RUNTIME_CREDENTIAL: ${{ github.event.inputs.runtime_credential_ref == 'AZURE_OPENAI_API_KEY' && secrets.AZURE_OPENAI_API_KEY || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const report = require('./.github/scripts/agent-report.cjs')
              .forGithubScript({ agent: 'ba-enrich', github, context, core });

            const agentInstructions = report.stripFootprintInstructions(readSafe('.github/agents/ba-product-agent.md'));
            const constitution      = readSafe('.specify/memory/constitution.md');

            // ── 1. Validate and parse issue number ────────────────────────────
            // Read from env to avoid expression injection (OWASP A03 / B1 fix).
            const issueNumber = parseInt(process.env.INPUT_ISSUE_NUMBER, 10);
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              report.abort(`Invalid issue_number: "${process.env.INPUT_ISSUE_NUMBER}"`);
              return;
            }

            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            await report.start({ issueNumber });

            // ── 2. Fetch issue data ───────────────────────────────────────────
            let issueTitle = '';
            let issueBody  = '';
            let issueLabels = [];
            try {
              const issue = await github.rest.issues.get({
                owner, repo, issue_number: issueNumber,
              });
              issueTitle  = issue.data.title  ?? '';
              issueBody   = issue.data.body   ?? '';
              issueLabels = (issue.data.labels ?? []).map(l => l.name ?? l);
            } catch (e) {
              report.abort(`Could not fetch issue #${issueNumber}: ${e.message}`);
              return;
            }

            // ── 3. Fetch the most recent triage comment ───────────────────────
            let triageComment = '';
            try {
              const comments = await github.rest.issues.listComments({
                owner, repo, issue_number: issueNumber, per_page: 30,
              });
              // The triage comment is typically the first bot comment; take the
              // earliest comment that looks like a triage summary.
              const triage = comments.data.find(c =>
                c.body && (
                  c.body.includes('type:') ||
                  c.body.includes('priority:') ||
                  c.body.includes('Triage') ||
                  c.body.includes('triage')
                )
              );
              if (triage) triageComment = triage.body;
            } catch {
              // Non-fatal — enrichment can proceed without the triage comment
            }

            // ── 4. Detect whether all four sections are already populated ──────
            // Section headings come from .github/ISSUE_TEMPLATE/feature_request.md
            const REQUIRED_SECTIONS = [
              '## Proposed Solution',
              '## Acceptance Criteria',
              '## Out of Scope',
              '## Alternatives Considered',
            ];

            function sectionContent(body, heading) {
              // Extract text between this heading and the next ## heading (or EOF)
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const m = body.match(new RegExp(`${escaped}\\s*\\n([\\s\\S]*?)(?=\\n## |$)`));
              if (!m) return '';
              // Strip HTML comments and whitespace — if only these remain, section is empty
              return m[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/^[\s\-\*\[\]\(\)xX]*$/gm, '')  // empty checkboxes / bullets
                .trim();
            }

            const alreadyFilled = REQUIRED_SECTIONS.every(h => sectionContent(issueBody, h).length > 0);

            if (alreadyFilled) {
              // Idempotency: all sections populated — no changes needed.
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  '**BA Issue Enrichment Agent** — No changes needed.',
                  '',
                  `Issue #${issueNumber} already contains content in all four structured sections ` +
                  '(Proposed Solution, Acceptance Criteria, Out of Scope, Alternatives Considered). ' +
                  'No update was made to the issue body.',
                ].join('\n'),
              });
              report.verdict({ outcome: 'success', summary: `Issue #${issueNumber} already has all four structured sections; no changes needed.` });
              return;
            }

            // ── 5. Call GitHub Models to infer missing sections ───────────────
            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub BA/product agent.';

            const userContent = [
              `You are the BA / Product Agent for issue #${issueNumber}, operating in ISSUE-REFINEMENT MODE.`,
              '',
              `## Issue Title`,
              issueTitle,
              '',
              `## Current Issue Body`,
              issueBody,
              ...(triageComment ? ['', '## Triage Summary', triageComment] : []),
              '',
              '## Instructions',
              'Your task is to enrich the issue body by inferring content for the four structured sections that are empty or missing.',
              'The four sections and their exact headings (you MUST use these exact headings, same level) are:',
              '  ## Proposed Solution',
              '  ## Acceptance Criteria',
              '  ## Out of Scope',
              '  ## Alternatives Considered',
              '',
              'Rules:',
              '1. Preserve ALL existing content verbatim — do not alter Problem / Motivation or any other non-empty section.',
              '2. Only fill in sections that are currently empty (contain only HTML comments, empty checkboxes, or whitespace).',
              '3. For Acceptance Criteria, use a Markdown checklist (- [ ] items).',
              '4. For Alternatives Considered, list at least one alternative even if the issue does not mention any — reason from the problem statement.',
              '5. If you CANNOT confidently infer a section (the issue is too ambiguous), respond with a JSON object {"canEnrich": false, "missingInfo": ["<question 1>", "<question 2>"]} only.',
              '6. If you CAN infer all sections, respond with a JSON object {"canEnrich": true, "enrichedBody": "<complete updated issue body>"} only.',
              '   - enrichedBody must be the COMPLETE issue body (not just the new sections) with all four sections filled in.',
              '7. Respond with ONLY a JSON object — no markdown fences, no prose.',
            ].join('\n');

            // ADR-332: Load default runtime from src/runtimes.yml when inputs are empty
            const runtimesYaml = readSafe('src/runtimes.yml');
            const defaultRuntimeMatch = runtimesYaml.match(/^default_runtime:\s*(\S+)/m);
            const defaultRuntimeName = defaultRuntimeMatch?.[1] || 'copilot-default';

            const parseRuntime = (yaml, name) => {
              const runtimeBlockMatch = new RegExp(`^\\s*${name}:\\s*$`, 'm').exec(yaml);
              if (!runtimeBlockMatch) return null;
              const startIdx = runtimeBlockMatch.index + runtimeBlockMatch[0].length;
              const remainingYaml = yaml.slice(startIdx);
              const endMatch = remainingYaml.match(/^\s*\w+:\s*$/m);
              const block = endMatch ? remainingYaml.slice(0, endMatch.index) : remainingYaml;
              const endpoint = block.match(/^\s+endpoint:\s*(\S+)/m)?.[1] || '';
              const model = block.match(/^\s+model:\s*(\S+)/m)?.[1] || 'gpt-4o';
              const credentialRef = block.match(/^\s+credential_ref:\s*(\S+)/m)?.[1] || 'GITHUB_TOKEN';
              const apiVersionMatch = block.match(/api_version:\s*["']([^"']+)["']/);
              const apiVersion = apiVersionMatch?.[1] || '';
              return { endpoint, model, credentialRef, apiVersion };
            };

            const defaultRuntime = parseRuntime(runtimesYaml, defaultRuntimeName);
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || defaultRuntime?.endpoint || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || defaultRuntime?.model || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || defaultRuntime?.apiVersion || '';
            const runtimeCredentialRef = defaultRuntime?.credentialRef || 'GITHUB_TOKEN';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL || 
              (runtimeCredentialRef === 'AZURE_OPENAI_API_KEY' ? process.env.AZURE_OPENAI_API_KEY : process.env.GITHUB_TOKEN) ||
              process.env.GITHUB_TOKEN;

            console.log(`Using runtime: ${defaultRuntimeName}`);
            console.log(`Endpoint: ${runtimeEndpoint || '(GitHub Models default)'}`);
            console.log(`Model: ${runtimeModel}`);
            console.log(`Credential: ${runtimeCredentialRef}`);
            if (!runtimeEndpoint) {
              // GitHub Models (models.inference.ai.azure.com) was retired on 2026-07-30: no hardcoded fallback host.
              report.abort('No runtime endpoint: set default_runtime in src/runtimes.yml or dispatch with runtime_endpoint.');
              return;
            }
            // SEC-CRIT-002 (Security Agent review, PR #334): restrict RUNTIME_ENDPOINT to
            // known Azure OpenAI / Azure AI Foundry hosts so it cannot be used as an SSRF
            // primitive if this workflow is ever dispatched directly (bypassing the Orchestrator).
            const allowedRuntimeEndpointHostSuffixes = ['.openai.azure.com', '.cognitiveservices.azure.com', '.services.ai.azure.com'];
            const isAllowedRuntimeEndpoint = raw => {
              try {
                const u = new URL(raw);
                return u.protocol === 'https:' && allowedRuntimeEndpointHostSuffixes.some(s => u.hostname.toLowerCase().endsWith(s));
              } catch { return false; }
            };
            if (runtimeEndpoint && !isAllowedRuntimeEndpoint(runtimeEndpoint)) {
              report.abort(`RUNTIME_ENDPOINT host is not on the allowlist (must be an https URL ending in ${allowedRuntimeEndpointHostSuffixes.join(' or ')}): ${runtimeEndpoint}`);
              return;
            }
            // SEC-HIGH-001 (Security re-review, PR #334): a host-suffix allowlist alone
            // doesn't bind the endpoint to the maintainer's own resource — anyone can
            // provision an Azure resource under the same public suffix. Reject any
            // endpoint that isn't one of the maintainer-reviewed entries committed to
            // src/runtimes.yml, so an attacker-provisioned resource is never reachable
            // even when RUNTIME_ENDPOINT is supplied directly via workflow_dispatch.
            const declaredRuntimeEndpoints = new Set(
              [...readSafe('src/runtimes.yml').matchAll(/^\s+endpoint:\s*(\S+)\s*$/gm)].map(m => m[1])
            );
            if (runtimeEndpoint && !declaredRuntimeEndpoints.has(runtimeEndpoint)) {
              report.abort(`RUNTIME_ENDPOINT is not declared in src/runtimes.yml: ${runtimeEndpoint}`);
              return;
            }
            // Foundry v1 "Responses" endpoints (…/openai/v1/responses) use a different
            // request/response shape than chat/completions; the legacy deployment-style
            // endpoints and the GitHub Models default keep using chat/completions.
            const useResponsesApi = !!runtimeEndpoint && /\/responses\/?$/.test(new URL(runtimeEndpoint).pathname);
            // The /openai/v1/ surface is versionless; do not send a dated api-version there.
            const sendApiVersion = runtimeApiVersion && !/\/openai\/v1\//.test(runtimeEndpoint);
            const apiVersionQuery = sendApiVersion ? `?api-version=${runtimeApiVersion}` : '';
            const requestUrl = useResponsesApi
              ? `${runtimeEndpoint}${apiVersionQuery}`
              : `${runtimeEndpoint}/chat/completions${apiVersionQuery}`;
            const authHeaders = { 'api-key': runtimeCredential };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(useResponsesApi
                ? {
                    model: runtimeModel,
                    instructions: systemContent,
                    input: userContent,
                    // Reasoning models spend output budget on reasoning tokens, so leave headroom.
                    max_output_tokens: 16384,
                    text: { format: { type: 'json_object' } },
                  }
                : {
                    model: runtimeModel,
                    messages: [
                      { role: 'system', content: systemContent },
                      { role: 'user',   content: userContent },
                    ],
                    max_tokens: 4096,
                    response_format: { type: 'json_object' },
                  }),
            });

            if (!res.ok) {
              const txt = await res.text();
              report.abort(`Runtime API error ${res.status}: ${txt}`);
              return;
            }

            const extractText = d => (useResponsesApi
              ? (d.output_text ?? (d.output ?? [])
                  .filter(item => item.type === 'message')
                  .flatMap(item => item.content ?? [])
                  .filter(c => c.type === 'output_text')
                  .map(c => c.text)
                  .join(''))
              : d.choices?.[0]?.message?.content
            )?.trim() || undefined;

            const data = await res.json();
            // Token usage + estimated cost for the audit trail (#335); never fails the run.
            report.recordUsage({ response: data, model: runtimeModel, runtime: defaultRuntimeName || 'azure-openai' });
            const rawContent = extractText(data) ?? '{}';

            let parsed;
            try {
              parsed = JSON.parse(rawContent);
            } catch (parseErr) {
              report.abort(`BA enrichment agent returned non-JSON response: ${parseErr.message}`);
              return;
            }

            // ── 6a. Success path: update body and swap labels ─────────────────
            if (parsed.canEnrich === true && typeof parsed.enrichedBody === 'string') {
              const newBody = parsed.enrichedBody.trim();
              if (!newBody) {
                report.abort('BA enrichment agent returned canEnrich:true but empty enrichedBody.');
                return;
              }

              // Update issue body in-place (FR-005)
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber,
                body: newBody,
              });

              // Swap labels: remove status:needs-info, add status:confirmed (FR-007)
              if (issueLabels.includes('status:needs-info')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber,
                  name: 'status:needs-info',
                }).catch(() => { /* label may already be gone — non-fatal */ });
              }
              // Ensure status:confirmed label exists
              try {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: 'status:confirmed',
                  color: '0e8a16',
                  description: 'Issue reproduced and confirmed',
                });
              } catch { /* label already exists — ignore */ }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber,
                labels: ['status:confirmed'],
              });

              // Post confirmation comment (FR-009)
              const filledSections = REQUIRED_SECTIONS.filter(h =>
                sectionContent(newBody, h).length > 0
              );
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  '**BA Issue Enrichment Agent** — Issue enriched successfully.',
                  '',
                  `Issue #${issueNumber} has been automatically enriched with inferred content in the following sections:`,
                  ...filledSections.map(h => `- ${h.replace('## ', '')}`),
                  '',
                  '`status:needs-info` has been removed. The issue is now `status:confirmed` and ready for spec-writing.',
                  '',
                  '_To write a formal spec, trigger the BA Agent manually via `/ba-agent`._',
                ].join('\n'),
              });

              report.verdict({
                outcome: 'success',
                summary: `Issue #${issueNumber} enriched: ${filledSections.map(h => h.replace('## ', '')).join(', ')}.`,
              });
              return;
            }

            // ── 6b. Degradation path: cannot infer — retain needs-info (FR-008) ─
            const missingInfo = Array.isArray(parsed.missingInfo) ? parsed.missingInfo : [];

            const questionList = missingInfo.length > 0
              ? missingInfo.map((q, i) => `${i + 1}. ${q}`).join('\n')
              : '1. The issue context is insufficient to infer the required sections.';

            // Post clarification comment (FR-009)
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                '**BA Issue Enrichment Agent** — Cannot complete enrichment automatically.',
                '',
                `Issue #${issueNumber} does not contain enough context to confidently infer all four required sections.`,
                'No changes have been made to the issue body. `status:needs-info` is retained.',
                '',
                'The following information is required before enrichment can proceed:',
                '',
                questionList,
                '',
                'Please reply to this comment with the requested information, then re-trigger the BA agent via `/ba-agent`.',
              ].join('\n'),
            });
            // status:needs-info is NOT touched (FR-008)

            report.verdict({
              outcome: 'needs-human',
              summary: `Issue #${issueNumber} lacks the context to infer the missing sections; ${missingInfo.length || 1} question(s) posted.`,
            });

      - name: Report result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.agent.outputs.outcome }}
          SUMMARY: ${{ steps.agent.outputs.summary }}
          ERROR: ${{ steps.agent.outputs.error }}
          PR_NUMBER: ${{ steps.agent.outputs.pr }}
          BRANCH: ${{ steps.agent.outputs.branch }}
          PAYLOAD: ${{ steps.agent.outputs.payload }}
          USAGE: ${{ steps.agent.outputs.usage }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = require('./.github/scripts/agent-report.cjs')
              .forGithubScript({ agent: 'ba-enrich', github, context, core });
            await report.conclude({ env: process.env });
