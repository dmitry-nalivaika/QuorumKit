name: Docs Agent (Copilot)

on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332); must match an endpoint declared in src/runtimes.yml (SEC-HIGH-001)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Must equal the literal string AZURE_OPENAI_API_KEY to use that credential (bounded allowlist, SEC-CRIT-001); any other value falls back to GITHUB_TOKEN (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      issue_number:
        description: 'Issue or PR number (used when triggered by the Orchestrator)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  docs:
    if: |
      github.event_name == 'push' ||
      (contains(github.event.comment.body, '@docs-agent') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Docs Agent via GitHub Models
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          RUNTIME_CREDENTIAL: ${{ github.event.inputs.runtime_credential_ref == 'AZURE_OPENAI_API_KEY' && secrets.AZURE_OPENAI_API_KEY || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const agentInstructions = readSafe('.github/agents/docs-agent.md');
            const constitution      = readSafe('.specify/memory/constitution.md');

            const trigger =
              context.eventName === 'push'
                ? `push to ${context.payload.ref} (${context.sha?.slice(0,7)})`
                : `comment by @${context.payload.comment?.user?.login ?? 'unknown'}`;

            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue?.number;
            const commentBody = context.payload.comment?.body ?? '';

            // FR-005 size limits
            const MAX_PER_FILE = 20 * 1024;   // 20 KB per file patch
            const MAX_TOTAL    = 400 * 1024;  // 400 KB total diff payload

            // FR-001 / FR-002: Resolve PR number from trigger context
            let prNumber = null;
            if (context.eventName === 'workflow_dispatch' && context.payload.inputs.issue_number) {
              prNumber = Number(context.payload.inputs.issue_number);
            } else if (context.payload.issue?.pull_request) {
              prNumber = context.payload.issue.number;          // comment on PR
            } else if (context.payload.pull_request?.number) {
              prNumber = context.payload.pull_request.number;   // review comment
            } else if (context.eventName === 'push') {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                commit_sha: context.sha,
              });
              const merged = prs.find(p => p.merged_at);
              if (merged) prNumber = merged.number;
            }

            // FR-003 / FR-004 / FR-005: Fetch real PR data
            let prContext = null;
            let apiError  = null;

            if (prNumber) {
              try {
                // workflow_dispatch may supply a plain issue number; handle 404 gracefully
                let pr;
                try {
                  const { data } = await github.rest.pulls.get({
                    owner: context.repo.owner, repo: context.repo.repo,
                    pull_number: prNumber,
                  });
                  pr = data;
                } catch (e) {
                  if (e.status === 404) { prNumber = null; }
                  else throw e;
                }

                if (pr) {
                  // Paginate files (up to 300 files)
                  let files = [], page = 1;
                  while (true) {
                    const { data: batch } = await github.rest.pulls.listFiles({
                      owner: context.repo.owner, repo: context.repo.repo,
                      pull_number: prNumber, per_page: 100, page,
                    });
                    files = files.concat(batch);
                    if (batch.length < 100) break;
                    page++;
                  }

                  const fileSummary = files
                    .map(f => `- ${f.status}: \`${f.filename}\` (+${f.additions}/-${f.deletions})`)
                    .join('\n');

                  // FR-005: apply per-file and total size limits
                  let totalSize = 0;
                  const omitted = [];
                  const patchSections = [];
                  for (const f of files) {
                    if (!f.patch) continue;
                    let patch = f.patch;
                    if (patch.length > MAX_PER_FILE)
                      patch = patch.slice(0, MAX_PER_FILE) + '\n[... truncated]';
                    if (totalSize + patch.length > MAX_TOTAL) {
                      omitted.push(f.filename);
                      continue;
                    }
                    patchSections.push(`### ${f.filename}\n\`\`\`diff\n${patch}\n\`\`\``);
                    totalSize += patch.length;
                  }
                  const truncNotice = omitted.length
                    ? `\n> ⚠️ Diff truncated at 400 KB. Omitted: ${omitted.map(n => `\`${n}\``).join(', ')}`
                    : '';

                  prContext = [
                    `## PR #${prNumber}: ${pr.title}`,
                    `**Author:** @${pr.user.login}`,
                    `**Merged:** ${pr.merged_at ?? 'not yet merged'}`,
                    `**Base → Head:** \`${pr.base.ref}\` ← \`${pr.head.ref}\``,
                    '',
                    '### PR Description',
                    pr.body?.trim() || '(no description)',
                    '',
                    `### Files Changed (${files.length})`,
                    fileSummary,
                    truncNotice,
                    '',
                    '### Patches',
                    ...patchSections,
                  ].join('\n');
                }
              } catch (err) {
                apiError = `GitHub API error fetching PR #${prNumber}: ${err.message}`;
              }
            }

            // FR-006: fallback to commit compare when push has no associated PR
            if (!prContext && !apiError && context.eventName === 'push') {
              try {
                const { data: comp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner:    context.repo.owner,
                  repo:     context.repo.repo,
                  basehead: `${context.payload.before}...${context.sha}`,
                });
                const compFiles = comp.files ?? [];
                const fileSummary = compFiles
                  .map(f => `- ${f.status}: \`${f.filename}\` (+${f.additions}/-${f.deletions})`)
                  .join('\n');
                let totalSize = 0;
                const patchSections = [];
                for (const f of compFiles) {
                  if (!f.patch) continue;
                  let patch = f.patch;
                  if (patch.length > MAX_PER_FILE)
                    patch = patch.slice(0, MAX_PER_FILE) + '\n[... truncated]';
                  if (totalSize + patch.length > MAX_TOTAL) break;
                  patchSections.push(`### ${f.filename}\n\`\`\`diff\n${patch}\n\`\`\``);
                  totalSize += patch.length;
                }
                prContext = [
                  `> ⚠️ No PR found for this push — using commit diff (${context.payload.before?.slice(0,7)}...${context.sha?.slice(0,7)}).`,
                  '',
                  `### Files Changed (${compFiles.length})`,
                  fileSummary,
                  '',
                  '### Patches',
                  ...patchSections,
                ].join('\n');
              } catch (err) {
                apiError = `GitHub API error fetching commit diff: ${err.message}`;
              }
            }

            if (!prContext && !apiError) {
              prContext = '> ⚠️ No PR or commit diff context found for this trigger.';
            }

            // FR-007: hard-abort on API error to prevent hallucination
            if (apiError) {
              const errBody = `## Docs Agent — API Error\n\n${apiError}\n\nThe Docs Agent could not retrieve the PR diff and is skipping the audit to prevent hallucinated findings.`;
              if (issueNumber) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, body: errBody,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `📄 Docs Agent Error – ${new Date().toISOString().slice(0,10)}`,
                  body: errBody, labels: ['documentation', 'agent-report'],
                });
              }
              return;
            }

            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub documentation agent.';

            // FR-008: grounded prompt — no fabrication
            const userContent = [
              `Triggered by: ${trigger}.`,
              commentBody ? `\nComment:\n${commentBody}` : '',
              '',
              '## Real PR Context',
              prContext,
              '',
              '## Your Task',
              'Using ONLY the real PR data provided above, audit the documentation for this PR.',
              'Base ALL findings exclusively on the diff — do NOT reference or suggest changes for files that do not appear in the diff.',
              'If a changed file requires no documentation update, explicitly state "No documentation change needed" for that file rather than fabricating a suggestion.',
              'Follow every step in your agent instructions and produce the Docs Review report.',
              'If documentation updates are needed, describe them clearly so a follow-up PR can be opened.',
            ].filter(Boolean).join('\n');

            // ADR-332: route to the maintainer's own Azure OpenAI / Azure AI
            // Foundry deployment when the Orchestrator's azure-openai runtime
            // adapter supplied these inputs; otherwise fall back to the
            // existing GitHub Models default (byte-for-byte unchanged).
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || '';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL || process.env.GITHUB_TOKEN;
            // SEC-CRIT-002 (Security Agent review, PR #334): restrict RUNTIME_ENDPOINT to
            // known Azure OpenAI / Azure AI Foundry hosts so it cannot be used as an SSRF
            // primitive if this workflow is ever dispatched directly (bypassing the Orchestrator).
            const allowedRuntimeEndpointHostSuffixes = ['.openai.azure.com', '.cognitiveservices.azure.com'];
            const isAllowedRuntimeEndpoint = raw => {
              try {
                const u = new URL(raw);
                return u.protocol === 'https:' && allowedRuntimeEndpointHostSuffixes.some(s => u.hostname.toLowerCase().endsWith(s));
              } catch { return false; }
            };
            if (runtimeEndpoint && !isAllowedRuntimeEndpoint(runtimeEndpoint)) {
              core.setFailed(`RUNTIME_ENDPOINT host is not on the allowlist (must be an https URL ending in ${allowedRuntimeEndpointHostSuffixes.join(' or ')}): ${runtimeEndpoint}`);
              return;
            }
            // SEC-HIGH-001 (Security re-review, PR #334): a host-suffix allowlist alone
            // doesn't bind the endpoint to the maintainer's own resource — anyone can
            // provision an Azure resource under the same public suffix. Reject any
            // endpoint that isn't one of the maintainer-reviewed entries committed to
            // src/runtimes.yml, so an attacker-provisioned resource is never reachable
            // even when RUNTIME_ENDPOINT is supplied directly via workflow_dispatch.
            const declaredRuntimeEndpoints = new Set(
              [...readSafe('src/runtimes.yml').matchAll(/^\s+endpoint:\s*(\S+)\s*$/gm)].map(m => m[1])
            );
            if (runtimeEndpoint && !declaredRuntimeEndpoints.has(runtimeEndpoint)) {
              core.setFailed(`RUNTIME_ENDPOINT is not declared in src/runtimes.yml: ${runtimeEndpoint}`);
              return;
            }
            const requestUrl = runtimeEndpoint
              ? `${runtimeEndpoint}/chat/completions${runtimeApiVersion ? `?api-version=${runtimeApiVersion}` : ''}`
              : 'https://models.inference.ai.azure.com/chat/completions';
            const authHeaders = runtimeEndpoint
              ? { 'api-key': runtimeCredential }
              : { 'Authorization': `Bearer ${runtimeCredential}` };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: runtimeModel,
                messages: [
                  { role: 'system', content: systemContent },
                  { role: 'user',   content: userContent },
                ],
                max_tokens: 2048,
              }),
            });

            if (!res.ok) {
              const txt = await res.text();
              core.setFailed(`Runtime API error ${res.status}: ${txt}`);
              return;
            }

            const data   = await res.json();
            const report = data.choices?.[0]?.message?.content?.trim()
              ?? '⚠️ Docs agent produced no output.';

            // Post as comment if triggered by a comment, otherwise open an issue
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                body:         report,
              });
            } else {
              await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title:  `📄 Docs Agent Report – ${new Date().toISOString().slice(0,10)}`,
                body:   report,
                labels: ['documentation', 'agent-report'],
              });
            }
