name: Security Agent (Copilot)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Optional secret name holding the API key for runtime_endpoint (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      issue_number:
        description: 'Issue or PR number (used when triggered by the Orchestrator)'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  security:
    if: |
      contains(github.event.comment.body, '@security-agent') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Security Agent via GitHub Models
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          RUNTIME_CREDENTIAL: ${{ (github.event.inputs.runtime_credential_ref && secrets[github.event.inputs.runtime_credential_ref]) || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const agentInstructions = readSafe('.github/agents/security-agent.md');
            const constitution      = readSafe('.specify/memory/constitution.md');

            const issueNumber   = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : (context.payload.issue?.number ?? context.payload.pull_request?.number);
            const commentBody   = context.payload.comment?.body ?? '';
            const commentAuthor = context.payload.comment?.user?.login ?? '';

            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub security review agent.';

            const userContent =
              `@${commentAuthor} asked you (via comment on #${issueNumber}) to perform a security review.\n` +
              `Comment:\n${commentBody}`;

            // ADR-332: route to the maintainer's own Azure OpenAI / Azure AI
            // Foundry deployment when the Orchestrator's azure-openai runtime
            // adapter supplied these inputs; otherwise fall back to the
            // existing GitHub Models default (byte-for-byte unchanged).
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || '';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL || process.env.GITHUB_TOKEN;
            const requestUrl = runtimeEndpoint
              ? `${runtimeEndpoint}/chat/completions${runtimeApiVersion ? `?api-version=${runtimeApiVersion}` : ''}`
              : 'https://models.inference.ai.azure.com/chat/completions';
            const authHeaders = runtimeEndpoint
              ? { 'api-key': runtimeCredential }
              : { 'Authorization': `Bearer ${runtimeCredential}` };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: runtimeModel,
                messages: [
                  { role: 'system', content: systemContent },
                  { role: 'user',   content: userContent },
                ],
                max_tokens: 2048,
              }),
            });

            if (!res.ok) {
              const txt = await res.text();
              core.setFailed(`GitHub Models API error ${res.status}: ${txt}`);
              return;
            }

            const data  = await res.json();
            const reply = data.choices?.[0]?.message?.content?.trim()
              ?? '⚠️ Security agent produced no output.';

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         reply,
            });
