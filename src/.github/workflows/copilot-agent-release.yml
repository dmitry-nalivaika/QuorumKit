name: Release Agent (Copilot)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_endpoint:
        description: 'Optional LLM endpoint override for Orchestrator v2 runtime dispatch (ADR-332)'
        required: false
        default: ''
      runtime_model:
        description: 'Optional LLM model/deployment override (ADR-332)'
        required: false
        default: ''
      runtime_credential_ref:
        description: 'Optional secret name holding the API key for runtime_endpoint (ADR-332)'
        required: false
        default: ''
      runtime_api_version:
        description: 'Optional API version query parameter for Azure OpenAI-style endpoints (ADR-332)'
        required: false
        default: ''
      bump:
        description: 'Version bump override (patch|minor|major)'
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Release Agent via GitHub Models
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_OVERRIDE: ${{ github.event.inputs.bump || 'auto' }}
          RUNTIME_ENDPOINT: ${{ github.event.inputs.runtime_endpoint }}
          RUNTIME_MODEL: ${{ github.event.inputs.runtime_model }}
          RUNTIME_API_VERSION: ${{ github.event.inputs.runtime_api_version }}
          RUNTIME_CREDENTIAL: ${{ (github.event.inputs.runtime_credential_ref && secrets[github.event.inputs.runtime_credential_ref]) || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const {execSync} = require('child_process');
            const readSafe = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const agentInstructions = readSafe('.github/agents/release-agent.md');
            const constitution      = readSafe('.specify/memory/constitution.md');

            // Collect recent commit log for context
            let commitLog = '';
            try { commitLog = execSync('git log --oneline -50', {encoding:'utf8'}); } catch {}

            const systemContent = [
              constitution      && `## Project Constitution\n${constitution}`,
              agentInstructions && `## Agent Instructions\n${agentInstructions}`,
            ].filter(Boolean).join('\n\n---\n\n')
              || 'You are a helpful GitHub release agent.';

            const userContent =
              `Bump override: ${process.env.BUMP_OVERRIDE}\n\n` +
              `Recent commits (last 50):\n${commitLog}\n\n` +
              `Determine the correct semver bump from commits since the last Git tag, ` +
              `generate the CHANGELOG delta, and describe the exact changes needed to ` +
              `update the version file and CHANGELOG.md so a Version Bump PR can be opened.`;

            // ADR-332: route to the maintainer's own Azure OpenAI / Azure AI
            // Foundry deployment when the Orchestrator's azure-openai runtime
            // adapter supplied these inputs; otherwise fall back to the
            // existing GitHub Models default (byte-for-byte unchanged).
            const runtimeEndpoint   = process.env.RUNTIME_ENDPOINT || '';
            const runtimeModel      = process.env.RUNTIME_MODEL || 'gpt-4o';
            const runtimeApiVersion = process.env.RUNTIME_API_VERSION || '';
            const runtimeCredential = process.env.RUNTIME_CREDENTIAL || process.env.GITHUB_TOKEN;
            const requestUrl = runtimeEndpoint
              ? `${runtimeEndpoint}/chat/completions${runtimeApiVersion ? `?api-version=${runtimeApiVersion}` : ''}`
              : 'https://models.inference.ai.azure.com/chat/completions';
            const authHeaders = runtimeEndpoint
              ? { 'api-key': runtimeCredential }
              : { 'Authorization': `Bearer ${runtimeCredential}` };

            const res = await fetch(requestUrl, {
              method: 'POST',
              headers: {
                ...authHeaders,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: runtimeModel,
                messages: [
                  { role: 'system', content: systemContent },
                  { role: 'user',   content: userContent },
                ],
                max_tokens: 2048,
              }),
            });

            if (!res.ok) {
              const txt = await res.text();
              core.setFailed(`GitHub Models API error ${res.status}: ${txt}`);
              return;
            }

            const data   = await res.json();
            const report = data.choices?.[0]?.message?.content?.trim()
              ?? '⚠️ Release agent produced no output.';

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `🚀 Release Agent Report – ${new Date().toISOString().slice(0,10)}`,
              body:   report,
              labels: ['release', 'agent-report'],
            });
